name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: acadconf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-retries=10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Lancer les tests
        working-directory: app
        run: mvn -B test
        env:
          MYSQLHOST: localhost
          MYSQLPORT: 3306
          MYSQLDATABASE: acadconf
          MYSQLUSER: root
          MYSQLPASSWORD: test-only-password

  docker-build:
    needs: build-test
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Construire l'image Docker
        run: docker build -t acadconf:${{ github.sha }} app

      - name: Télécharger les bases de failles Trivy (3 tentatives)
        run: |
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "Échec (tentative $i sur 3), nouvelle tentative dans 20 s"
              sleep 20
            done
            return 1
          }
          retry docker run --rm -v trivy-cache:/root/.cache/ aquasec/trivy:0.74.0 \
            image --download-db-only --no-progress --skip-version-check
          retry docker run --rm -v trivy-cache:/root/.cache/ aquasec/trivy:0.74.0 \
            image --download-java-db-only --no-progress --skip-version-check

      - name: Scanner l'image avec Trivy (bloquant si HIGH ou CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:0.74.0 image \
            --skip-db-update \
            --skip-java-db-update \
            --no-progress \
            --skip-version-check \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            acadconf:${{ github.sha }}
