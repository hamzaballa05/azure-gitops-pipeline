name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: acadconf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-retries=10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Lancer les tests
        working-directory: app
        run: mvn -B test
        env:
          MYSQLHOST: localhost
          MYSQLPORT: 3306
          MYSQLDATABASE: acadconf
          MYSQLUSER: root
          MYSQLPASSWORD: test-only-password
